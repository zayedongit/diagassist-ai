<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daigassist Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 30px;
      margin-bottom: 20px;
    }

    .login-card {
      max-width: 400px;
      margin: 100px auto;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    h2 {
      color: #667eea;
      margin-bottom: 20px;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
      width: auto;
      padding: 10px 20px;
      margin-left: 10px;
    }

    .btn-secondary:hover {
      background: #f5f5f5;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .success {
      background: #efe;
      color: #3c3;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-number {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th {
      background: #f8f9fa;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #e0e0e0;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
    }

    tr:hover {
      background: #f8f9fa;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: #d4edda;
      color: #155724;
    }

    .badge-danger {
      background: #f8d7da;
      color: #721c24;
    }

    .badge-warning {
      background: #fff3cd;
      color: #856404;
    }

    .badge-info {
      background: #d1ecf1;
      color: #0c5460;
    }

    .table-container {
      overflow-x: auto;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .user-info {
      background: #f8f9fa;
      padding: 10px 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 14px;
    }

    .user-info strong {
      color: #667eea;
    }
  </style>
</head>
<body>
  <!-- Login Screen -->
  <div id="loginScreen" class="login-card card">
    <h2>🔐 Admin Login</h2>
    <p class="subtitle">Daigassist Admin Dashboard</p>
    
    <div id="loginError" class="error hidden"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="phoneNumber">Phone Number</label>
        <input type="tel" id="phoneNumber" value="+917993448425" required>
      </div>
      
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      
      <button type="submit" id="loginBtn">Login</button>
    </form>
  </div>

  <!-- Dashboard Screen -->
  <div id="dashboardScreen" class="container hidden">
    <div class="card">
      <div class="header">
        <div>
          <h1>📊 Admin Dashboard</h1>
          <p class="subtitle">Manage and monitor all analyses</p>
        </div>
        <div class="user-info">
          <span><strong>Phone:</strong> <span id="userPhone"></span></span>
          <button class="btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-number" id="totalAnalyses">0</div>
          <div class="stat-label">Total Analyses</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="completedAnalyses">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="failedAnalyses">0</div>
          <div class="stat-label">Failed</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="smsSent">0</div>
          <div class="stat-label">SMS Alerts Sent</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters">
        <div class="form-group">
          <label for="statusFilter">Status Filter</label>
          <select id="statusFilter" onchange="fetchAnalyses()">
            <option value="all">All Statuses</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
            <option value="pending">Pending</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="notificationFilter">SMS Notification</label>
          <select id="notificationFilter" onchange="fetchAnalyses()">
            <option value="all">All Notifications</option>
            <option value="sent">Sent</option>
            <option value="failed">Failed</option>
            <option value="pending">Pending</option>
          </select>
        </div>

        <div class="form-group">
          <label for="limitFilter">Results Per Page</label>
          <select id="limitFilter" onchange="fetchAnalyses()">
            <option value="50">50</option>
            <option value="100" selected>100</option>
            <option value="200">200</option>
            <option value="500">500</option>
          </select>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button onclick="fetchAnalyses()">🔄 Refresh Data</button>
        <button class="btn-secondary" onclick="exportToCSV()">📥 Export to CSV</button>
      </div>

      <div id="dashboardError" class="error hidden"></div>
      <div id="dashboardSuccess" class="success hidden"></div>

      <!-- Loading -->
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading analyses...</p>
      </div>

      <!-- Table -->
      <div class="table-container">
        <table id="analysesTable">
          <thead>
            <tr>
              <th>Analysis ID</th>
              <th>Patient Name</th>
              <th>User ID</th>
              <th>Created At</th>
              <th>Status</th>
              <th>SMS Status</th>
              <th>SMS Sent At</th>
              <th>Error Message</th>
            </tr>
          </thead>
          <tbody id="analysesTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://eijdffylunwsusiayxzb.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpamRmZnlsdW53c3VzaWF5eHpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIyNzA1NzIsImV4cCI6MjA3Nzg0NjU3Mn0.aEpIylw-Bu5zPUmEnJ1Nkm5xU8SQkUaUCzk6dmxlFMk';
    
    let currentToken = null;
    let allAnalyses = [];

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const phoneNumber = document.getElementById('phoneNumber').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const loginError = document.getElementById('loginError');
      
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';
      loginError.classList.add('hidden');
      
      try {
        // Login
        const authResponse = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            phone: phoneNumber,
            password: password
          })
        });
        
        if (!authResponse.ok) {
          const error = await authResponse.json();
          throw new Error(error.error_description || 'Login failed');
        }
        
        const authData = await authResponse.json();
        currentToken = authData.access_token;
        
        // Verify admin role
        const adminResponse = await fetch(`${SUPABASE_URL}/functions/v1/check-admin-role`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${currentToken}`,
            'apikey': SUPABASE_ANON_KEY
          }
        });
        
        if (!adminResponse.ok) {
          throw new Error('Failed to verify admin role');
        }
        
        const adminData = await adminResponse.json();
        
        if (!adminData.isAdmin) {
          throw new Error('Access denied - Admin privileges required');
        }
        
        // Show dashboard
        document.getElementById('userPhone').textContent = adminData.phone || phoneNumber;
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        
        // Fetch analyses
        await fetchAnalyses();
        
      } catch (error) {
        loginError.textContent = error.message;
        loginError.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });

    // Fetch Analyses
    async function fetchAnalyses() {
      const loading = document.getElementById('loading');
      const tableBody = document.getElementById('analysesTableBody');
      const dashboardError = document.getElementById('dashboardError');
      
      loading.classList.remove('hidden');
      tableBody.innerHTML = '';
      dashboardError.classList.add('hidden');
      
      try {
        const status = document.getElementById('statusFilter').value;
        const notificationStatus = document.getElementById('notificationFilter').value;
        const limit = document.getElementById('limitFilter').value;
        
        const params = new URLSearchParams({
          status: status,
          notificationStatus: notificationStatus,
          limit: limit,
          offset: '0'
        });
        
        const response = await fetch(`${SUPABASE_URL}/functions/v1/get-all-analyses?${params}`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${currentToken}`,
            'apikey': SUPABASE_ANON_KEY
          }
        });
        
        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to fetch analyses');
        }
        
        const data = await response.json();
        allAnalyses = data.analyses || [];
        
        // Update stats
        updateStats(allAnalyses);
        
        // Populate table
        if (allAnalyses.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; padding: 40px; color: #999;">No analyses found</td></tr>';
        } else {
          allAnalyses.forEach(analysis => {
            const row = createTableRow(analysis);
            tableBody.appendChild(row);
          });
        }
        
      } catch (error) {
        dashboardError.textContent = error.message;
        dashboardError.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
      }
    }

    // Create Table Row
    function createTableRow(analysis) {
      const row = document.createElement('tr');
      
      const patientName = getPatientName(analysis.result);
      const createdAt = new Date(analysis.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
      const smsAt = analysis.admin_notified_at ? new Date(analysis.admin_notified_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }) : '-';
      
      const statusBadge = getStatusBadge(analysis.status);
      const smsBadge = getSMSBadge(analysis);
      
      row.innerHTML = `
        <td>${analysis.id.substring(0, 8)}...</td>
        <td>${patientName}</td>
        <td>${analysis.user_id.substring(0, 8)}...</td>
        <td>${createdAt}</td>
        <td>${statusBadge}</td>
        <td>${smsBadge}</td>
        <td>${smsAt}</td>
        <td>${analysis.error_message || '-'}</td>
      `;
      
      return row;
    }

    // Get Patient Name
    function getPatientName(result) {
      if (!result) return 'N/A';
      return result.patientName || result.patient_name || result.name || 'Unknown';
    }

    // Get Status Badge
    function getStatusBadge(status) {
      const badges = {
        completed: '<span class="badge badge-success">✓ Completed</span>',
        failed: '<span class="badge badge-danger">✗ Failed</span>',
        pending: '<span class="badge badge-warning">⏳ Pending</span>'
      };
      return badges[status] || '<span class="badge badge-info">' + status + '</span>';
    }

    // Get SMS Badge
    function getSMSBadge(analysis) {
      if (analysis.admin_alerted) {
        return '<span class="badge badge-success">✓ Sent</span>';
      } else if (analysis.error_message) {
        return '<span class="badge badge-danger">✗ Failed</span>';
      } else {
        return '<span class="badge badge-warning">⏳ Pending</span>';
      }
    }

    // Update Stats
    function updateStats(analyses) {
      const total = analyses.length;
      const completed = analyses.filter(a => a.status === 'completed').length;
      const failed = analyses.filter(a => a.status === 'failed').length;
      const smsSent = analyses.filter(a => a.admin_alerted).length;
      
      document.getElementById('totalAnalyses').textContent = total;
      document.getElementById('completedAnalyses').textContent = completed;
      document.getElementById('failedAnalyses').textContent = failed;
      document.getElementById('smsSent').textContent = smsSent;
    }

    // Export to CSV
    function exportToCSV() {
      if (allAnalyses.length === 0) {
        alert('No data to export');
        return;
      }
      
      const headers = ['Analysis ID', 'Patient Name', 'User ID', 'Created At', 'Status', 'SMS Sent', 'SMS Sent At', 'Error Message'];
      const rows = allAnalyses.map(analysis => [
        analysis.id,
        getPatientName(analysis.result),
        analysis.user_id,
        new Date(analysis.created_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }),
        analysis.status,
        analysis.admin_alerted ? 'Yes' : 'No',
        analysis.admin_notified_at ? new Date(analysis.admin_notified_at).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' }) : '',
        analysis.error_message || ''
      ]);
      
      const csv = [
        headers.join(','),
        ...rows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
      ].join('\n');
      
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `daigassist-analyses-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      
      const successMsg = document.getElementById('dashboardSuccess');
      successMsg.textContent = 'CSV exported successfully!';
      successMsg.classList.remove('hidden');
      setTimeout(() => successMsg.classList.add('hidden'), 3000);
    }

    // Logout
    function logout() {
      currentToken = null;
      allAnalyses = [];
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('dashboardScreen').classList.add('hidden');
      document.getElementById('password').value = '';
    }
  </script>
</body>
</html>
